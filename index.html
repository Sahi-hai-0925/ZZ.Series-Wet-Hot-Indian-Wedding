<!DOCTYPE html>
<html>
<head>
    <title>ZZ.Series Wet Hot Indian Wedding</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            overflow-x: hidden;
            background: linear-gradient(-45deg, #0f0c29, #1a0033, #000428, #2c003e);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        h1 {
            padding: 30px 10px;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00f0ff, #ff00c8, #00f0ff);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowText 4s linear infinite;
        }

        @keyframes glowText {
            0% { background-position: 0%; }
            100% { background-position: 200%; }
        }

        .tabs {
            margin: 20px 0;
        }

        .tab-button {
            background: rgba(255,255,255,0.05);
            border: 2px solid #00f0ff;
            color: #ccc;
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.3s;
            backdrop-filter: blur(8px);
        }

        .tab-button:hover {
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #ff00c8;
            transform: translateY(-3px);
        }

        .tab-button.active {
            color: white;
            box-shadow: 0 0 20px #ff00c8, 0 0 40px #00f0ff;
        }

        .video-wrapper {
            position: relative;
            width: 95%;
            max-width: 1000px;
            margin: 30px auto;
            padding-top: 56.25%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,240,255,0.3);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .video-wrapper.fade {
            opacity: 0;
            transform: scale(0.95);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            margin: 40px 0;
            opacity: 0.6;
            font-size: 14px;
        }
    </style>
</head>

<body>

<h1>ZZ.Series Wet Hot Indian Wedding</h1>

<div class="tabs">
    <button class="tab-button active" onclick="showVideo(1)">Part 1</button>
    <button class="tab-button" onclick="showVideo(2)">Part 2</button>
    <button class="tab-button" onclick="showVideo(3)">Part 3</button>
    <button class="tab-button" onclick="showVideo(4)">Part 4</button>
</div>

<div class="video-wrapper" id="video-wrapper">
    <div id="player"></div>
</div>

<footer>Neon Streaming Experience ⚡</footer>

<script src="https://pornve.com/"></script>

<script>
    let player;
    let currentPart = 1;

    const videos = {
        1: "https://pornve.com/embed/468144",
        2: "https://pornve.com/embed/468915",
        3: "https://pornve.com/embed/470007",
        4: "https://pornve.com/embed/471129"
    };

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: videos[1],
            playerVars: { autoplay: 1 },
            events: {
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            if (currentPart < 4) {
                showVideo(currentPart + 1);
            }
        }
    }

    function showVideo(part) {
        const wrapper = document.getElementById("video-wrapper");
        const buttons = document.querySelectorAll(".tab-button");

        currentPart = part;

        buttons.forEach(btn => btn.classList.remove("active"));
        buttons[part - 1].classList.add("active");

        wrapper.classList.add("fade");

        setTimeout(() => {
            player.loadVideoById(videos[part]);
            wrapper.classList.remove("fade");
        }, 400);
    }
</script>

</body>
</html>

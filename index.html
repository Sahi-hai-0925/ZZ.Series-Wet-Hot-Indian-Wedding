<!DOCTYPE html>
<html>
<head>
    <title>ZZ.Series</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }

        /* Password Screen */
        #password-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #password-screen input {
            padding: 10px;
            font-size: 16px;
            border: none;
            outline: none;
            border-radius: 5px;
        }

        #password-screen button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: #ff00ff;
            color: white;
            border-radius: 5px;
        }

        h1 {
            padding: 30px 10px;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }

        .tabs {
            margin: 20px 0;
        }

        .tab-button {
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            margin: 0 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-button.active {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .video-container {
            margin: 20px auto;
            max-width: 900px;
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
        }

        .fade-out {
            opacity: 0;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            box-shadow: 0 0 25px #00ffff;
        }

        #main-content {
            display: none;
        }
    </style>
</head>

<body>

<!-- Password Screen -->
<div id="password-screen">
    <h2>Enter Password</h2>
    <input type="password" id="password-input">
    <button onclick="checkPassword()">Enter</button>
</div>

<div id="main-content">
    <h1>ZZ.Series</h1>

    <div class="tabs">
        <button class="tab-button active" onclick="showVideo(1)">Part 1</button> |
        <button class="tab-button" onclick="showVideo(2)">Part 2</button> |
        <button class="tab-button" onclick="showVideo(3)">Part 3</button> |
        <button class="tab-button" onclick="showVideo(4)">Part 4</button>
    </div>

    <div class="video-container" id="video-area">
        <iframe src="https://pornve.com/embed/468144" allowfullscreen></iframe>
    </div>
</div>

<script>
    const correctPassword = "1234"; // change this

    function checkPassword() {
        const input = document.getElementById("password-input").value;
        if (input === correctPassword) {
            document.getElementById("password-screen").style.display = "none";
            document.getElementById("main-content").style.display = "block";
        } else {
            alert("Wrong password");
        }
    }

    function showVideo(part) {
        const videoArea = document.getElementById("video-area");
        const buttons = document.querySelectorAll(".tab-button");

        buttons.forEach(btn => btn.classList.remove("active"));
        buttons[part - 1].classList.add("active");

        const videos = {
            1: "https://pornve.com/embed/468144",
            2: "https://pornve.com/embed/468915",
            3: "https://pornve.com/embed/470007",
            4: "https://pornve.com/embed/471129"
        };

        videoArea.classList.add("fade-out");

        setTimeout(() => {
            videoArea.innerHTML = `<iframe src="${videos[part]}" allowfullscreen></iframe>`;
            videoArea.classList.remove("fade-out");
        }, 300);
    }
</script>

</body>
</html>

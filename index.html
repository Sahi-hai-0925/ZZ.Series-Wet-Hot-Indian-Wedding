<!DOCTYPE html>
<html>
<head>
<title>ZZ.Series</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:black; /* fully black at start */
    color:white;
    overflow-x:hidden;
}

/* ===== LOCK SCREEN ===== */
#lockScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:20;
}

#lockScreen h2{
    color:#00ffff;
    text-shadow:0 0 15px #00ffff;
}

#lockScreen input{
    padding:12px;
    font-size:18px;
    border-radius:8px;
    border:none;
    text-align:center;
}

#lockScreen button{
    margin-top:15px;
    padding:10px 25px;
    background:#ff00ff;
    border:none;
    color:white;
    border-radius:8px;
    box-shadow:0 0 20px #ff00ff;
    cursor:pointer;
}

/* ===== MAIN SECTION ===== */
#mainSection{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:all 0.5s ease;
}

/* when video selected */
.top-mode{
    justify-content:flex-start !important;
    padding-top:40px;
}

/* ===== GLITCH TITLE ===== */
.glitch{
    font-size:60px;
    text-align:center;
    position:relative;
    animation:glitch 1s infinite;
    text-shadow:0 0 10px #ff00ff,0 0 20px #00ffff;
}

.top-mode .glitch{
    font-size:32px;
}

@keyframes glitch{
    0%{text-shadow:2px 2px #ff00ff,-2px -2px #00ffff;}
    25%{text-shadow:-2px 2px #ff00ff,2px -2px #00ffff;}
    50%{text-shadow:2px -2px #ff00ff,-2px 2px #00ffff;}
    75%{text-shadow:-2px -2px #ff00ff,2px 2px #00ffff;}
    100%{text-shadow:2px 2px #ff00ff,-2px -2px #00ffff;}
}

/* ===== TABS ===== */
.tabs{
    margin-top:30px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.tab-button{
    background:rgba(255,255,255,0.05);
    border:2px solid #00ffff;
    color:#00ffff;
    padding:12px 22px;
    margin:6px;
    cursor:pointer;
    border-radius:10px;
    transition:0.3s;
    text-shadow:0 0 10px #00ffff;
}

.tab-button:hover{
    background:#00ffff;
    color:black;
    box-shadow:0 0 20px #00ffff;
}

.tab-button.active{
    background:#ff00ff;
    border-color:#ff00ff;
    color:black;
    box-shadow:0 0 25px #ff00ff;
}

/* ===== VIDEO ===== */
.video-container{
    width:92%;
    max-width:950px;
    margin:40px auto;
    display:none;
    padding:0 12px; /* breathing space */
}

.video-container iframe{
    width:100%;
    aspect-ratio:16/9;
    border-radius:15px;
    box-shadow:0 0 40px #00ffff;
}

/* mobile bigger */
@media(max-width:768px){

    .glitch{
        font-size:40px;
    }

    .video-container{
        width:90%;
        padding:0 15px;
        margin-top:30px;
    }

    .tabs{
        gap:10px;
    }

    .tab-button{
        padding:10px 16px;
        font-size:14px;
    }
}

/* lightning flash */
.flash{
    position:fixed;
    width:100%;
    height:100%;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:15;
}

.flash.active{
    animation:flashAnim 0.2s;
}

@keyframes flashAnim{
    0%{opacity:0.9;}
    100%{opacity:0;}
}
</style>
</head>

<body>

<div id="lockScreen">
    <h2>ENTER ACCESS PIN</h2>
    <input type="password" id="pinInput" maxlength="4" placeholder="****">
    <button onclick="checkPin()">ACCESS</button>
</div>

<div class="flash" id="flash"></div>

<div id="mainSection">

    <h1 class="glitch">ZZ.Series</h1>

    <div class="tabs">
        <button class="tab-button" onclick="showVideo(1)">Part 1</button>
        <button class="tab-button" onclick="showVideo(2)">Part 2</button>
        <button class="tab-button" onclick="showVideo(3)">Part 3</button>
        <button class="tab-button" onclick="showVideo(4)">Part 4</button>
    </div>

    <div class="video-container" id="videoArea">
        <iframe src="https://pornve.com/embed/468144"></iframe>
    </div>

</div>

<script>

/* PIN */
function checkPin(){
    if(document.getElementById("pinInput").value==="1234"){
        document.getElementById("lockScreen").style.display="none";
    }else{
        alert("ACCESS DENIED");
    }
}

/* VIDEO SWITCH */
function showVideo(part){

    const flash=document.getElementById("flash");
    flash.classList.add("active");
    setTimeout(()=>flash.classList.remove("active"),200);

    const videos = {
        1: "https://pornve.com/embed/468144",
        2: "https://pornve.com/embed/468915",
        3: "https://pornve.com/embed/470007",
        4: "https://pornve.com/embed/471129"
    };

    document.getElementById("videoArea").style.display="block";
    document.getElementById("videoArea").innerHTML=
        `<iframe src="${videos[part]}" allowfullscreen></iframe>`;

    document.getElementById("mainSection").classList.add("top-mode");

    document.querySelectorAll(".tab-button").forEach(btn=>btn.classList.remove("active"));
    document.querySelectorAll(".tab-button")[part-1].classList.add("active");
}

</script>

</body>
</html>

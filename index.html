<!DOCTYPE html>
<html>
<head>
    <title>ZZ.Series</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Neon Grid Overlay */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,0,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: moveGrid 10s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
        }

        h1 {
            margin-top: 40px;
            font-size: 32px;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
            position: relative;
            z-index: 1;
        }

        .tabs {
            margin: 30px 0;
            position: relative;
            z-index: 1;
        }

        .tab-button {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 10px 18px;
            margin: 5px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 6px;
            text-shadow: 0 0 8px #00ffff;
        }

        .tab-button:hover {
            background: #00ffff;
            color: black;
            box-shadow: 0 0 15px #00ffff;
        }

        .tab-button.active {
            background: #ff00ff;
            border-color: #ff00ff;
            color: black;
            box-shadow: 0 0 20px #ff00ff;
        }

        .video-container {
            max-width: 900px;
            margin: auto;
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
            position: relative;
            z-index: 1;
        }

        .fade-out {
            opacity: 0;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            box-shadow: 0 0 30px #00ffff;
        }
    </style>
</head>

<body>

<h1>ZZ.Series</h1>

<div class="tabs">
    <button class="tab-button active" onclick="showVideo(1)">Part 1</button>
    <button class="tab-button" onclick="showVideo(2)">Part 2</button>
    <button class="tab-button" onclick="showVideo(3)">Part 3</button>
    <button class="tab-button" onclick="showVideo(4)">Part 4</button>
</div>

<div class="video-container" id="video-area">
    <iframe src="https://pornve.com/embed/468144" allowfullscreen></iframe>
</div>

<script>
    function showVideo(part) {
        const videoArea = document.getElementById("video-area");
        const buttons = document.querySelectorAll(".tab-button");

        buttons.forEach(btn => btn.classList.remove("active"));
        buttons[part - 1].classList.add("active");

        const videos = {
            1: "https://pornve.com/embed/468144",
            2: "https://pornve.com/embed/468915",
            3: "https://pornve.com/embed/470007",
            4: "https://pornve.com/embed/471129"
        };

        videoArea.classList.add("fade-out");

        setTimeout(() => {
            videoArea.innerHTML = `<iframe src="${videos[part]}" allowfullscreen></iframe>`;
            videoArea.classList.remove("fade-out");
        }, 300);
    }
</script>

</body>
</html>
